description: >-
  Skypunk is an independent game studio headquartered in San Diego, California,
  founded in 2021 to build new science-fiction multiplayer games. The studio is
  backed by Andreessen Horowitz (a16z) and has raised approximately $750K in
  early funding. It was surfaced as a portfolio company of a16z and added to the
  API Evangelist network for enrichment. Skypunk is a consumer game developer,
  not an API producer: its public presence is a studio marketing site and it
  publishes no developer portal, documentation, OpenAPI, SDKs, or any external
  API surface at this time.
